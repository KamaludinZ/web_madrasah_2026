; Batas upload dinaikkan untuk fitur Backup/Restore/Update Aplikasi di
; /admin/manage-settings — backup penuh (database + media) dan ZIP update
; kode aplikasi bisa berukuran puluhan hingga ratusan MB.
;
; Dihormati otomatis oleh PHP-FPM (umum dipakai cPanel) tanpa perlu akses ke
; php.ini server. Kalau hosting pakai mod_php/Apache biasa (bukan FPM), file
; ini tidak berlaku — naikkan lewat cPanel "MultiPHP INI Editor" alih-alih.
upload_max_filesize = 200M
post_max_size = 220M
max_execution_time = 1200
memory_limit = 512M

; Keamanan — PHP2Shell (CVE-2026-109618): matikan upload progress sesi
; (tidak dipakai aplikasi). Tetap WAJIB perbarui PHP ke 8.2.35 / 8.3.36 /
; 8.4.27 / 8.5.12 atau lebih baru lewat cPanel "MultiPHP Manager".
session.upload_progress.enabled = Off
