; Proses untuk peran "app": php-fpm + nginx. Jika salah satu mati, supervisor
; menyalakannya lagi; jika gagal terus, container keluar agar Docker/Coolify
; me-restart-nya.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Container berhenti bila salah satu proses gagal permanen (FATAL),
; sehingga orkestrator (Docker restart policy/Coolify) menanganinya.
[eventlistener:exit-on-fatal]
command=sh -c 'printf "READY\n"; while read -r line; do echo "$line" >&2; kill -TERM 1; done'
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
