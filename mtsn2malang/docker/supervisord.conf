; Proses untuk peran "app": php-fpm + nginx (+ queue worker & scheduler bila
; diaktifkan, lihat di bawah). Jika salah satu mati, supervisor
; menyalakannya lagi; jika gagal terus, container keluar agar Docker/Coolify
; me-restart-nya.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker & scheduler di dalam container app — dipakai saat deploy
; Dockerfile saja (satu container). Nyala/mati lewat env RUN_QUEUE_WORKER dan
; RUN_SCHEDULER (dinormalkan entrypoint menjadi SUPERVISOR_*_AUTOSTART).
; docker-compose.yml mematikannya karena punya container worker/scheduler.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --memory=256 --max-time=3600
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
priority=30
autostart=%(ENV_SUPERVISOR_QUEUE_AUTOSTART)s
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
; Beri waktu job berjalan (backup/restore/migrasi) untuk selesai.
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
priority=40
autostart=%(ENV_SUPERVISOR_SCHEDULER_AUTOSTART)s
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Container berhenti bila salah satu proses gagal permanen (FATAL),
; sehingga orkestrator (Docker restart policy/Coolify) menanganinya.
[eventlistener:exit-on-fatal]
command=sh -c 'printf "READY\n"; while read -r line; do echo "$line" >&2; kill -TERM 1; done'
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
