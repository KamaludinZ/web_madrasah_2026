; Pool php-fpm untuk container (menimpa zz-docker.conf bawaan image).
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data

; Hanya bisa dijangkau nginx di container yang sama — bukan dari container lain.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; WAJIB: tanpa ini env var dari Coolify (DB_*, APP_KEY, dst.) tidak terbaca PHP.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
; nginx sudah mencatat akses; hindari log ganda.
access.log = /dev/null

; Endpoint internal untuk health check (hanya dari 127.0.0.1, lihat site.conf)
ping.path = /fpm-ping
ping.response = pong

request_terminate_timeout = 1200
