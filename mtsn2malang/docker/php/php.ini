; Pengaturan PHP produksi — MTsN 2 Kota Malang (Docker)

; Batas upload besar untuk fitur Backup/Restore/Import (selaras dengan
; client_max_body_size di nginx dan batas upload Livewire 190MB).
upload_max_filesize = 200M
post_max_size = 220M
memory_limit = 512M
max_execution_time = 1200
max_input_time = 1200
max_input_vars = 5000

; Keamanan
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = On
allow_url_fopen = On

date.timezone = Asia/Jakarta

; OPcache — kode tidak berubah selama container hidup (redeploy = container
; baru), jadi validasi timestamp dimatikan demi performa.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
