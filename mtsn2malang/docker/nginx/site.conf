# Situs Laravel — dilayani di port 8080; HTTPS ditangani proxy Coolify.
server {
    # Hanya IPv4: banyak host Docker mematikan IPv6 di container, dan
    # "listen [::]" akan membuat nginx gagal start. Proxy Coolify memakai IPv4.
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Catatan: header keamanan untuk respons PHP dikirim oleh middleware
    # SecurityHeaders Laravel. Di sini hanya ditambahkan untuk file statis
    # (per lokasi) agar tidak terkirim ganda.

    # File tersembunyi (.env, .git, .htaccess, dll.) tidak pernah disajikan
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Upload pengguna: jangan pernah dieksekusi sebagai PHP
    location ~* ^/storage/.*\.(php|phtml|phar)$ {
        deny all;
        return 404;
    }

    # SVG lama di storage tidak boleh menjalankan skrip saat dibuka langsung
    location ~* ^/storage/.*\.svg$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        expires 30d;
        try_files $uri =404;
    }

    # Aset hasil build Vite (nama file ber-hash) — cache panjang
    location ^~ /build/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|ico|woff2?|ttf|pdf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri /images/favicon.ico; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Health check internal php-fpm (hanya dari dalam container)
    location = /fpm-ping {
        allow 127.0.0.1;
        deny all;
        access_log off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 1200s;
    }

    # File .php lain di public/ tidak dieksekusi (hanya index.php)
    location ~ \.php$ {
        return 404;
    }
}
